<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="shelf" />
    <title>shelf | Book</title>
    <meta name="theme-color" content="#FDFCFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
        // Apply the theme before the app renders to avoid a flash.
        (function () {
            try {
                var t = localStorage.getItem("theme");
                var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.classList.add("dark");
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root">
        <!-- React replaces this at once. It only shows if the app's scripts
             never start, so the reader is not left with a blank screen. -->
        <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:14px system-ui,sans-serif;color:#8a847f;opacity:0;animation:boot-slow .2s 5s forwards">
            <p style="margin:0">読み込みに時間がかかっています</p>
            <a href="/" style="padding:10px 24px;border-radius:999px;background:#FF6305;color:#fff;text-decoration:none;font-weight:600">再読み込み</a>
        </div>
        <style>@keyframes boot-slow { to { opacity: 1 } }</style>
    </div>
    <script src="./src/index.tsx"></script>
</body>

</html>
