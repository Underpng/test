# Optional: container deployment for Linux hosts. On Windows use dist\shelf.exe.
services:
  shelf:
    build: .
    container_name: shelf_book
    ports:
      - "50080:50080"
    volumes:
      - ./books:/books:ro
      - ./data:/data
    environment:
      - TZ=Asia/Tokyo
      - PAGE_SIZE=20
      - COVER_SIZE=300
      - COVER_QUALITY=75
    restart: unless-stopped
